<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passkey einrichten</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="center">
    <div class="card login">
      <div class="brand"><img src="/static/icon.svg" width="26" height="26" alt=""> Depotplaner</div>
      <p>Lege für dieses Gerät einen Passkey an.</p>
      <label class="f left">Bezeichnung (optional)
        <input id="label" maxlength="60" placeholder="z. B. iPhone">
      </label>
      <button class="btn primary" id="reg">Passkey erstellen</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </main>
  <script src="/static/webauthn.js"></script>
  <script src="/static/register.js"></script>
</body>
</html>
